<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161f; --ink2:#1c1f2c; --ink3:#252939;
    --bone:#e8e3d6; --mute:#868ca3;
    --brass:#c8a24a; --rose:#b5757a;
    --line:rgba(232,227,214,.12);
    --serif:'Gowun Batang', serif;
    --sans:'IBM Plex Sans KR', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:15px;line-height:1.65}
  #root{max-width:560px;margin:0 auto;padding:0 18px 120px}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font-family:inherit;font-size:16px;color:var(--bone);background:var(--ink2);
    border:1px solid var(--line);border-radius:8px;padding:11px 13px;width:100%;outline:none;resize:none}
  input:focus,textarea:focus{border-color:var(--brass)}
  input::placeholder,textarea::placeholder{color:#5d6377}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .top{display:flex;align-items:center;gap:12px;padding:22px 0 18px}
  .top h1{font-family:var(--serif);font-size:23px;font-weight:700;margin:0;letter-spacing:.06em}
  .top .sub{color:var(--mute);font-size:12px;letter-spacing:.1em;margin-left:auto}
  .back{color:var(--mute);font-size:14px;padding:6px 0}

  .shelf-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px;width:100%;
    border-bottom:3px solid #3a3222;margin-bottom:26px;box-shadow:0 3px 10px -4px rgba(0,0,0,.7)}
  .spine{height:158px;border-radius:3px 3px 0 0;display:flex;align-items:center;justify-content:center;
    padding:12px 4px;position:relative;border-top:2px solid rgba(200,162,74,.45);transition:transform .18s ease}
  .spine:active{transform:translateY(-6px)}
  .spine span{writing-mode:vertical-rl;font-family:var(--serif);font-size:14px;letter-spacing:.05em;
    line-height:1.3;max-height:130px;overflow:hidden;text-align:left}
  .spine .dot{position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--brass)}
  .spine.add{border:1px dashed rgba(232,227,214,.3);border-radius:3px;width:44px;
    color:var(--mute);font-size:20px;background:transparent}

  .card{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
  .quote{font-family:var(--serif);font-size:16.5px;line-height:1.85;white-space:pre-wrap}
  .qmeta{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:12px;margin-bottom:9px}
  .qmeta .pg{color:var(--brass);letter-spacing:.05em}
  .memo{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);color:var(--mute);font-size:13.5px;white-space:pre-wrap}

  .tabs{display:flex;gap:4px;margin:16px 0 20px;border-bottom:1px solid var(--line)}
  .tabs button{padding:9px 14px;color:var(--mute);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--bone);border-bottom-color:var(--brass)}

  .msg{margin-bottom:16px;display:flex;flex-direction:column}
  .msg .who{font-size:11px;color:var(--mute);letter-spacing:.12em;margin-bottom:5px}
  .msg .bubble{padding:12px 14px;border-radius:10px;white-space:pre-wrap;line-height:1.7}
  .msg.human .bubble{background:var(--ink3);border-left:2px solid var(--brass)}
  .msg.ai .bubble{background:transparent;border:1px solid var(--line);border-left:2px solid var(--rose)}
  .composer{position:fixed;bottom:0;left:0;right:0;background:var(--ink);border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
  .composer .in{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}

  .topic{border:1px solid var(--line);border-radius:10px;padding:17px;margin-bottom:14px;background:var(--ink2)}
  .topic h3{font-family:var(--serif);font-size:18px;margin:0 0 10px;font-weight:700;line-height:1.4}
  .topic .num{color:var(--brass);font-size:12px;letter-spacing:.18em;display:block;margin-bottom:6px}
  .topic .tq{font-family:var(--serif);font-size:15px;line-height:1.8;border-left:2px solid var(--rose);
    padding:2px 0 2px 13px;margin:12px 0;color:#d6d1c4;white-space:pre-wrap}
  .topic .tq .pg{display:block;font-family:var(--sans);font-size:11px;color:var(--mute);margin-top:5px}
  .op{margin-top:10px;font-size:14px;line-height:1.7}
  .op b{color:var(--brass);font-weight:500;font-size:12px;letter-spacing:.08em;margin-right:7px}
  .apply{margin-top:14px;padding:12px 13px;background:rgba(200,162,74,.09);border-radius:7px;font-size:14px;line-height:1.7}
  .apply b{display:block;color:var(--brass);font-size:11px;letter-spacing:.14em;margin-bottom:5px;font-weight:500}

  .btn{background:var(--brass);color:#14161f;border-radius:8px;padding:12px 18px;font-weight:600;font-size:15px;text-align:center}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone);font-weight:400}
  .btn:disabled{opacity:.45}
  .btn.sm{padding:9px 14px;font-size:13.5px}
  .fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.5)}

  .empty{color:var(--mute);text-align:center;padding:46px 20px;font-size:14px;line-height:1.9}
  .empty b{display:block;font-family:var(--serif);font-size:17px;color:var(--bone);margin-bottom:8px;font-weight:400}
  .err{background:rgba(181,117,122,.14);border:1px solid var(--rose);border-radius:8px;padding:11px 13px;font-size:13.5px;margin-bottom:14px}
  .sheet{position:fixed;inset:0;background:rgba(10,11,16,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet .box{background:var(--ink2);width:100%;max-width:560px;border-radius:16px 16px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h2{font-family:var(--serif);font-size:19px;margin:0 0 16px;font-weight:700}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--mute);letter-spacing:.06em;margin-bottom:6px}
  .row{display:flex;gap:9px}
  .row>*{flex:1}
  .thinking{color:var(--mute);font-size:13.5px;padding:6px 0 20px;letter-spacing:.04em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
/* ══════════════════════════════════════════════════
   ▼▼▼ 여기 두 줄만 본인 것으로 교체 ▼▼▼
   ══════════════════════════════════════════════════ */
const SUPABASE_URL = "https://whyoeekvnvqtsgqmlywj.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoeW9lZWt2bnZxdHNncW1seXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjM1NDAsImV4cCI6MjEwMjQzOTU0MH0.mYIrGDbzNo_4Rg_lEKU5cI4YJXyuQtDoQYRC5j1M47U";
/* ══════════════════════════════════════════════════ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const { useState, useEffect, useRef } = React;

const SPINES = ["#2f4a4d","#4a2f42","#45482c","#563226","#2e3350","#39403f","#4a3a2c"];
const pick = (s) => {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
  return SPINES[h % SPINES.length];
};

async function callAI(mode, payload) {
  const r = await fetch("/api/gemini", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode, payload })
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "AI 호출에 실패했습니다.");
  return d;
}

/* ─────────── 로그인 ─────────── */
function Auth() {
  const [email, setEmail] = useState("");
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const send = async () => {
    if (!email.trim()) return;
    setBusy(true); setErr("");
    const { error } = await sb.auth.signInWithOtp({
      email: email.trim(),
      options: { emailRedirectTo: window.location.origin }
    });
    setBusy(false);
    error ? setErr(error.message) : setSent(true);
  };

  return (
    <div style={{paddingTop:"22vh"}}>
      <h1 style={{fontFamily:"var(--serif)",fontSize:30,letterSpacing:".1em",margin:"0 0 10px"}}>서재</h1>
      <p style={{color:"var(--mute)",fontSize:14,margin:"0 0 30px",lineHeight:1.8}}>
        읽은 책이 흩어지지 않도록.<br/>문장을 담고, 이야기하고, 남겨둡니다.
      </p>
      {sent ? (
        <div className="card">메일로 로그인 링크를 보냈습니다. 링크를 열면 바로 들어옵니다.</div>
      ) : (
        <>
          {err && <div className="err">{err}</div>}
          <div className="field">
            <input type="email" placeholder="이메일 주소" value={email}
              onChange={e=>setEmail(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&send()} />
          </div>
          <button className="btn" style={{width:"100%"}} onClick={send} disabled={busy}>
            {busy ? "보내는 중" : "로그인 링크 받기"}
          </button>
        </>
      )}
    </div>
  );
}

/* ─────────── 서재(책장) ─────────── */
function Shelf({ onOpen }) {
  const [books, setBooks] = useState(null);
  const [counts, setCounts] = useState({});
  const [adding, setAdding] = useState(false);
  const [f, setF] = useState({ title:"", author:"", publisher:"" });
  const [err, setErr] = useState("");

  const load = async () => {
    const { data: bs, error } = await sb.from("books").select("*").order("created_at",{ascending:false});
    if (error) { setErr(error.message); setBooks([]); return; }
    setBooks(bs || []);
    const { data: qs } = await sb.from("quotes").select("book_id");
    const c = {};
    (qs||[]).forEach(q => { c[q.book_id] = (c[q.book_id]||0) + 1; });
    setCounts(c);
  };
  useEffect(() => { load(); }, []);

  const add = async () => {
    if (!f.title.trim()) return;
    const { error } = await sb.from("books").insert({
      title: f.title.trim(),
      author: f.author.trim() || null,
      publisher: f.publisher.trim() || null
    });
    if (error) { setErr(error.message); return; }
    setAdding(false); setF({title:"",author:"",publisher:""}); load();
  };

  if (books === null) return <div className="empty">불러오는 중</div>;

  return (
    <>
      <div className="top">
        <h1>서재</h1>
        <span className="sub">{books.length}권</span>
      </div>
      {err && <div className="err">{err}</div>}

      {books.length === 0 ? (
        <div className="empty">
          <b>아직 꽂힌 책이 없습니다</b>
          첫 책을 등록하면 여기에 책등이 세워집니다.
        </div>
      ) : (
        <div className="shelf-row">
          {books.map(b => {
            const n = counts[b.id] || 0;
            const w = Math.min(30 + n * 3.2, 62);
            return (
              <button key={b.id} className="spine"
                style={{background:pick(b.title), width:w}}
                onClick={()=>onOpen(b)} title={b.title}>
                {b.status === "reading" && <span className="dot"/>}
                <span>{b.title}</span>
              </button>
            );
          })}
          <button className="spine add" onClick={()=>setAdding(true)}>＋</button>
        </div>
      )}

      {books.length === 0 &&
        <button className="btn" style={{width:"100%"}} onClick={()=>setAdding(true)}>책 등록하기</button>}

      {adding && (
        <div className="sheet" onClick={e=>e.target===e.currentTarget&&setAdding(false)}>
          <div className="box">
            <h2>책 등록</h2>
            <div className="field"><label>제목</label>
              <input value={f.title} onChange={e=>setF({...f,title:e.target.value})} autoFocus/></div>
            <div className="row">
              <div className="field"><label>지은이</label>
                <input value={f.author} onChange={e=>setF({...f,author:e.target.value})}/></div>
              <div className="field"><label>출판사</label>
                <input value={f.publisher} onChange={e=>setF({...f,publisher:e.target.value})}/></div>
            </div>
            <div className="row" style={{marginTop:8}}>
              <button className="btn ghost" onClick={()=>setAdding(false)}>취소</button>
              <button className="btn" onClick={add}>책장에 꽂기</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/* ─────────── 문장 탭 ─────────── */
function Quotes({ book, quotes, reload }) {
  const [open, setOpen] = useState(false);
  const [f, setF] = useState({ page:"", content:"", memo:"" });
  const [err, setErr] = useState("");

  const save = async () => {
    if (!f.content.trim()) return;
    const { error } = await sb.from("quotes").insert({
      book_id: book.id, page: f.page.trim() || null,
      content: f.content.trim(), memo: f.memo.trim() || null, input_type: "typed"
    });
    if (error) { setErr(error.message); return; }
    setOpen(false); setF({page:"",content:"",memo:""}); reload();
  };

  const del = async (id) => {
    if (!window.confirm("이 문장을 지웁니다. 되돌릴 수 없습니다.")) return;
    await sb.from("quotes").delete().eq("id", id);
    reload();
  };

  return (
    <>
      {err && <div className="err">{err}</div>}
      {quotes.length === 0 ? (
        <div className="empty">
          <b>담은 문장이 없습니다</b>
          읽다가 멈춰 세운 문장을 그대로 옮겨 두세요.<br/>대화는 이 문장들에서 시작합니다.
        </div>
      ) : quotes.map(q => (
        <div className="card" key={q.id}>
          <div className="qmeta">
            {q.page && <span className="pg">{q.page}</span>}
            <button style={{marginLeft:"auto",color:"var(--mute)",fontSize:12}} onClick={()=>del(q.id)}>지우기</button>
          </div>
          <div className="quote">{q.content}</div>
          {q.memo && <div className="memo">{q.memo}</div>}
        </div>
      ))}

      <button className="btn fab" onClick={()=>setOpen(true)}>문장 담기</button>

      {open && (
        <div className="sheet" onClick={e=>e.target===e.currentTarget&&setOpen(false)}>
          <div className="box">
            <h2>문장 담기</h2>
            <div className="field"><label>쪽수 (선택)</label>
              <input value={f.page} onChange={e=>setF({...f,page:e.target.value})} placeholder="112"/></div>
            <div className="field"><label>문장</label>
              <textarea rows="5" value={f.content} onChange={e=>setF({...f,content:e.target.value})} autoFocus/></div>
            <div className="field"><label>스친 생각 (선택)</label>
              <textarea rows="2" value={f.memo} onChange={e=>setF({...f,memo:e.target.value})}/></div>
            <div className="row" style={{marginTop:8}}>
              <button className="btn ghost" onClick={()=>setOpen(false)}>취소</button>
              <button className="btn" onClick={save}>담기</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/* ─────────── 대화 탭 ─────────── */
function Talk({ book, quotes, onOrganized }) {
  const [session, setSession] = useState(null);
  const [msgs, setMsgs] = useState([]);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [org, setOrg] = useState(false);
  const [err, setErr] = useState("");
  const endRef = useRef(null);

  useEffect(() => { (async () => {
    let { data } = await sb.from("sessions").select("*")
      .eq("book_id", book.id).eq("status","open")
      .order("created_at",{ascending:false}).limit(1);
    let s = data && data[0];
    if (!s) {
      const { data: made, error } = await sb.from("sessions")
        .insert({ book_id: book.id, title: "대화" }).select().single();
      if (error) { setErr(error.message); return; }
      s = made;
    }
    setSession(s);
    const { data: ms } = await sb.from("messages").select("*")
      .eq("session_id", s.id).order("created_at",{ascending:true});
    setMsgs(ms || []);
  })(); }, [book.id]);

  useEffect(() => { endRef.current && endRef.current.scrollIntoView({behavior:"smooth"}); }, [msgs, busy]);

  const send = async () => {
    const t = text.trim();
    if (!t || !session || busy) return;
    setText(""); setErr(""); setBusy(true);
    const mine = { session_id: session.id, role:"human", author_name:"나", content: t };
    const { data: saved } = await sb.from("messages").insert(mine).select().single();
    const next = [...msgs, saved || {...mine, id:"tmp"}];
    setMsgs(next);
    try {
      const { text: reply } = await callAI("chat", {
        book: { title: book.title, author: book.author },
        quotes: quotes.map(q => ({ page:q.page, content:q.content, memo:q.memo })),
        history: next.map(m => ({ role:m.role, content:m.content }))
      });
      const { data: aiSaved } = await sb.from("messages")
        .insert({ session_id: session.id, role:"ai", author_name:"AI", content: reply })
        .select().single();
      setMsgs(m => [...m, aiSaved]);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  const organize = async () => {
    if (!window.confirm("지금까지의 대화를 주제별로 정리해 남깁니다. 대화는 이어서 계속할 수 있습니다.")) return;
    setOrg(true); setErr("");
    try {
      const qmap = {};
      quotes.forEach((q,i) => { qmap["q"+(i+1)] = q.id; });
      const { topics } = await callAI("organize", {
        book: { title: book.title, author: book.author },
        quotes: quotes.map((q,i) => ({ id:"q"+(i+1), page:q.page, content:q.content })),
        messages: msgs.map(m => ({ who: m.author_name, content: m.content }))
      });
      for (let i = 0; i < topics.length; i++) {
        const t = topics[i];
        const { data: tp, error } = await sb.from("topics").insert({
          book_id: book.id, session_id: session.id,
          title: t.title, summary: t.summary || null,
          apply_note: t.apply_note || null, order_no: i
        }).select().single();
        if (error) throw new Error(error.message);
        const links = (t.quote_ids||[]).map(k => qmap[k]).filter(Boolean)
          .map(qid => ({ topic_id: tp.id, quote_id: qid }));
        if (links.length) await sb.from("topic_quotes").insert(links);
        const ops = (t.opinions||[]).filter(o => o.content)
          .map(o => ({ topic_id: tp.id, author_name: o.author_name || "나", content: o.content }));
        if (ops.length) await sb.from("topic_opinions").insert(ops);
      }
      onOrganized();
    } catch (e) { setErr(e.message); }
    setOrg(false);
  };

  return (
    <>
      {err && <div className="err">{err}</div>}
      {msgs.length === 0 && !busy && (
        <div className="empty">
          <b>무엇이든 먼저 던져 보세요</b>
          담아둔 문장 {quotes.length}개를 이미 읽고 있습니다.<br/>
          질문을 되돌려주고, 다른 관점도 내놓습니다.
        </div>
      )}
      {msgs.map(m => (
        <div className={"msg " + (m.role==="ai" ? "ai" : "human")} key={m.id}>
          <span className="who">{m.author_name}</span>
          <div className="bubble">{m.content}</div>
        </div>
      ))}
      {busy && <div className="thinking">생각하는 중…</div>}
      {msgs.length >= 4 && !busy && (
        <button className="btn ghost sm" style={{width:"100%",marginTop:6}} onClick={organize} disabled={org}>
          {org ? "정리하는 중…" : "여기까지 주제별로 정리하기"}
        </button>
      )}
      <div ref={endRef}/>
      <div className="composer">
        <div className="in">
          <textarea rows="1" value={text} placeholder="이 책에 대해…"
            onChange={e=>setText(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}/>
          <button className="btn sm" onClick={send} disabled={busy}>보내기</button>
        </div>
      </div>
    </>
  );
}

/* ─────────── 정리 탭 ─────────── */
function Topics({ book, quotes }) {
  const [topics, setTopics] = useState(null);
  const qById = {};
  quotes.forEach(q => { qById[q.id] = q; });

  useEffect(() => { (async () => {
    const { data: ts } = await sb.from("topics").select("*")
      .eq("book_id", book.id).order("order_no",{ascending:true});
    if (!ts || !ts.length) { setTopics([]); return; }
    const ids = ts.map(t => t.id);
    const { data: tq } = await sb.from("topic_quotes").select("*").in("topic_id", ids);
    const { data: op } = await sb.from("topic_opinions").select("*").in("topic_id", ids);
    setTopics(ts.map(t => ({
      ...t,
      quotes: (tq||[]).filter(x=>x.topic_id===t.id).map(x=>qById[x.quote_id]).filter(Boolean),
      opinions: (op||[]).filter(x=>x.topic_id===t.id)
    })));
  })(); }, [book.id, quotes.length]);

  if (topics === null) return <div className="empty">불러오는 중</div>;
  if (!topics.length) return (
    <div className="empty">
      <b>아직 정리된 주제가 없습니다</b>
      대화 탭에서 이야기를 나눈 뒤<br/>‘주제별로 정리하기’를 누르면 여기 쌓입니다.
    </div>
  );

  return topics.map((t, i) => (
    <div className="topic" key={t.id}>
      <span className="num">주제 {String(i+1).padStart(2,"0")}</span>
      <h3>{t.title}</h3>
      {t.summary && <div style={{fontSize:14.5,lineHeight:1.75,color:"#d0ccc0"}}>{t.summary}</div>}
      {t.quotes.map(q => (
        <div className="tq" key={q.id}>{q.content}
          {q.page && <span className="pg">{q.page}쪽</span>}
        </div>
      ))}
      {t.opinions.map(o => (
        <div className="op" key={o.id}><b>{o.author_name}</b>{o.content}</div>
      ))}
      {t.apply_note && <div className="apply"><b>내게 적용할 점</b>{t.apply_note}</div>}
    </div>
  ));
}

/* ─────────── 책 상세 ─────────── */
function BookView({ book, onBack }) {
  const [tab, setTab] = useState("quotes");
  const [quotes, setQuotes] = useState([]);
  const [key, setKey] = useState(0);

  const load = async () => {
    const { data } = await sb.from("quotes").select("*")
      .eq("book_id", book.id).order("created_at",{ascending:true});
    setQuotes(data || []);
  };
  useEffect(() => { load(); }, [book.id]);

  return (
    <>
      <button className="back" onClick={onBack}>← 서재</button>
      <div className="top" style={{paddingTop:8,alignItems:"baseline"}}>
        <h1 style={{fontSize:20,letterSpacing:".02em"}}>{book.title}</h1>
      </div>
      {book.author && <div style={{color:"var(--mute)",fontSize:13,marginTop:-10,marginBottom:4}}>{book.author}</div>}

      <div className="tabs">
        <button className={tab==="quotes"?"on":""} onClick={()=>setTab("quotes")}>문장 {quotes.length}</button>
        <button className={tab==="talk"?"on":""} onClick={()=>setTab("talk")}>대화</button>
        <button className={tab==="topics"?"on":""} onClick={()=>setTab("topics")}>정리</button>
      </div>

      {tab==="quotes" && <Quotes book={book} quotes={quotes} reload={load}/>}
      {tab==="talk"   && <Talk book={book} quotes={quotes} onOrganized={()=>{setKey(k=>k+1);setTab("topics");}}/>}
      {tab==="topics" && <Topics key={key} book={book} quotes={quotes}/>}
    </>
  );
}

/* ─────────── 앱 ─────────── */
function App() {
  const [session, setSession] = useState(undefined);
  const [book, setBook] = useState(null);

  useEffect(() => {
    sb.auth.getSession().then(({data}) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) return null;
  if (!session) return <Auth/>;
  return book
    ? <BookView book={book} onBack={()=>setBook(null)}/>
    : <Shelf onOpen={setBook}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
