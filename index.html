<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>책은성장</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f3eee2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="책은성장">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee2; --card:#fbf8f0; --ink:#282419; --soft:#7d7666;
    --rule:#ddd4bf; --accent:#8a5a24; --rose:#9c4a4f; --wood:#b9a179;
    --serif:'Gowun Batang', serif;
    --sans:'IBM Plex Sans KR', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
  #root{max-width:560px;margin:0 auto;padding:0 18px 130px}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:#fff;
    border:1px solid var(--rule);border-radius:8px;padding:11px 13px;width:100%;outline:none;resize:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  input::placeholder,textarea::placeholder{color:#a9a291}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .top{display:flex;align-items:center;gap:12px;padding:22px 0 16px}
  .top h1{font-family:var(--serif);font-size:23px;font-weight:700;margin:0;letter-spacing:.06em}
  .top .sub{color:var(--soft);font-size:12px;letter-spacing:.1em;margin-left:auto}
  .back{color:var(--soft);font-size:14px;padding:10px 0 4px;display:inline-block}

  /* 하단 이동 막대 */
  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--rule);
    display:flex;justify-content:center;gap:6px;padding:8px 18px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .nav button{flex:1;max-width:170px;padding:9px 0;font-size:14px;color:var(--soft);
    border-radius:8px;font-family:var(--serif);letter-spacing:.08em}
  .nav button.on{color:var(--accent);background:#eae2cf;font-weight:700}

  .search{margin-bottom:16px;background:#fff}

  /* 표지 격자 */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
  .gcard{position:relative;text-align:left;padding:0}
  .gcard img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;
    box-shadow:0 4px 12px rgba(80,60,30,.3);display:block}
  .gblank{width:100%;aspect-ratio:2/3;border-radius:4px;display:flex;align-items:center;
    justify-content:center;padding:10px;color:#f6f1e4;font-family:var(--serif);
    font-size:13px;line-height:1.45;text-align:center;
    box-shadow:0 4px 12px rgba(80,60,30,.3)}
  .gdot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 2px #fbf8f0}
  .gtitle{display:block;margin-top:7px;font-size:12.5px;line-height:1.45;color:var(--ink);
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .gadd{border:1px dashed var(--rule);border-radius:4px;aspect-ratio:2/3;
    display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:24px}

  /* 알라딘 검색 결과 */
  .found{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    padding:12px 2px;border-bottom:1px solid var(--rule)}
  .found img{width:44px;border-radius:3px;flex:none;box-shadow:0 2px 6px rgba(80,60,30,.25)}
  .found .nocover{width:44px;height:64px;border-radius:3px;flex:none;display:block}
  .found b{display:block;font-size:14.5px;font-weight:500;line-height:1.45;margin-bottom:4px}
  .found .meta{display:block;color:var(--soft);font-size:12px;line-height:1.5}

  .sthumb{width:44px;border-radius:3px;flex:none;box-shadow:0 2px 6px rgba(80,60,30,.25)}

  .daily{display:block;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--rule);border-left:3px solid var(--accent);
    border-radius:0 10px 10px 0;padding:17px 17px 15px;margin-bottom:24px}
  .daily .cap{display:block;color:var(--accent);font-size:11px;letter-spacing:.16em;margin-bottom:9px}
  .daily .txt{display:block;font-family:var(--serif);font-size:16.5px;line-height:1.9;
    color:var(--ink);white-space:pre-wrap}
  .daily .from{display:block;margin-top:11px;color:var(--soft);font-size:12px}
  .shelf-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px;width:100%;
    border-bottom:4px solid var(--wood);margin-bottom:28px;box-shadow:0 4px 8px -5px rgba(80,60,30,.45)}
  .spine{height:158px;border-radius:3px 3px 0 0;display:flex;align-items:center;justify-content:center;
    padding:12px 4px;position:relative;color:#f6f1e4;border-top:2px solid rgba(255,255,255,.28);
    transition:transform .18s ease}
  .spine:active{transform:translateY(-6px)}
  .spine span{writing-mode:vertical-rl;font-family:var(--serif);font-size:14px;letter-spacing:.05em;
    line-height:1.3;max-height:130px;overflow:hidden;text-align:left}
  .spine .dot{position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:#f2d79a}
  .spine.add{border:1px dashed var(--rule);border-radius:3px;width:44px;color:var(--soft);
    font-size:20px;background:transparent}

  .card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:12px}
  .quote{font-family:var(--serif);font-size:16.5px;line-height:1.85;white-space:pre-wrap}
  .qmeta{display:flex;gap:10px;align-items:center;color:var(--soft);font-size:12px;margin-bottom:9px}
  .qmeta .pg{color:var(--accent);letter-spacing:.05em}
  .memo{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule);color:var(--soft);
    font-size:13.5px;white-space:pre-wrap}

  .tabs{display:flex;gap:4px;margin:14px 0 20px;border-bottom:1px solid var(--rule)}
  .tabs button{padding:9px 14px;color:var(--soft);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

  .msg{margin-bottom:16px;display:flex;flex-direction:column}
  .msg .who{font-size:11px;color:var(--soft);letter-spacing:.12em;margin-bottom:5px}
  .msg .bubble{padding:12px 14px;border-radius:10px;white-space:pre-wrap;line-height:1.7}
  .msg.human .bubble{background:#eae2cf;border-left:2px solid var(--accent)}
  .msg.ai .bubble{background:var(--card);border:1px solid var(--rule);border-left:2px solid var(--rose)}
  .composer{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom));left:0;right:0;
    background:var(--paper);border-top:1px solid var(--rule);padding:12px 18px}
  .composer .in{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}

  .topic{border:1px solid var(--rule);border-radius:10px;padding:17px;margin-bottom:14px;background:var(--card)}
  .topic h3{font-family:var(--serif);font-size:18px;margin:0 0 10px;font-weight:700;line-height:1.4}
  .topic .num{color:var(--accent);font-size:12px;letter-spacing:.14em;display:inline-block;
    margin-bottom:7px;background:#f0e6d0;padding:2px 9px;border-radius:11px;font-weight:500}
  .loose{margin-top:14px;padding:12px 13px;background:#f4ece4;border-left:2px solid var(--rose);
    border-radius:0 7px 7px 0;font-size:14px;line-height:1.7}
  .loose b{display:block;color:var(--rose);font-size:11px;letter-spacing:.14em;margin-bottom:5px;font-weight:500}
  .topic .tq{font-family:var(--serif);font-size:15px;line-height:1.8;border-left:2px solid var(--rose);
    padding:2px 0 2px 13px;margin:12px 0;color:#4a453a;white-space:pre-wrap}
  .topic .tq .pg{display:block;font-family:var(--sans);font-size:11px;color:var(--soft);margin-top:5px}
  .op{margin-top:11px;font-size:14px;line-height:1.7;white-space:pre-wrap}
  .op b{color:var(--accent);font-weight:500;font-size:12px;letter-spacing:.08em;margin-right:7px}
  .op.mine{border-left:2px solid var(--accent);padding-left:10px}
  .apply{margin-top:14px;padding:12px 13px;background:#f0e6d0;border-radius:7px;font-size:14px;line-height:1.7}
  .apply b{display:block;color:var(--accent);font-size:11px;letter-spacing:.14em;margin-bottom:5px;font-weight:500}
  .opbox{margin-top:14px;padding-top:13px;border-top:1px dashed var(--rule)}

  .btn{background:var(--accent);color:#fdfaf3;border-radius:8px;padding:12px 18px;font-weight:600;
    font-size:15px;text-align:center}
  .btn.ghost{background:#fff;border:1px solid var(--rule);color:var(--ink);font-weight:400}
  .btn:disabled{opacity:.45}
  .btn.sm{padding:9px 14px;font-size:13.5px}
  .fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:15;box-shadow:0 6px 18px rgba(90,70,40,.28)}

  .empty{color:var(--soft);text-align:center;padding:44px 20px;font-size:14px;line-height:1.9}
  .empty b{display:block;font-family:var(--serif);font-size:17px;color:var(--ink);margin-bottom:8px;font-weight:400}
  .err{background:#f7e4e2;border:1px solid #d9a9a4;color:#7d332f;border-radius:8px;
    padding:11px 13px;font-size:13.5px;margin-bottom:14px;line-height:1.7}
  .ok{background:#e6efe0;border:1px solid #a9c39a;color:#3d5730;border-radius:8px;
    padding:11px 13px;font-size:13.5px;margin-bottom:14px;line-height:1.7}
  .sheet{position:fixed;inset:0;background:rgba(45,38,25,.42);z-index:60;display:flex;
    align-items:flex-end;justify-content:center}
  .sheet .box{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
    box-shadow:0 -8px 30px rgba(60,45,20,.2)}
  .sheet h2{font-family:var(--serif);font-size:19px;margin:0 0 16px;font-weight:700}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--soft);letter-spacing:.06em;margin-bottom:6px}
  .row{display:flex;gap:9px}
  .row>*{flex:1}
  .thinking{color:var(--soft);font-size:13.5px;padding:6px 0 20px;letter-spacing:.04em}

  .sbook{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);
    border-radius:10px;padding:15px;margin-bottom:11px;width:100%;text-align:left}
  .sbook .bar{width:7px;align-self:stretch;border-radius:3px;min-height:52px}
  .sbook h4{font-family:var(--serif);font-size:17px;margin:0 0 3px;font-weight:700}
  .sbook .meta{color:var(--soft);font-size:12.5px}
  .sbook .note{margin-top:7px;font-size:13.5px;color:#5c5647;line-height:1.65}
  .toggle{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--rule);
    border-radius:10px;padding:14px 15px;margin-bottom:16px;font-size:13.5px;line-height:1.6}
  .toggle input{width:auto;flex:none;transform:scale(1.25);accent-color:var(--accent)}
  .linkbox{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:11px 13px;
    font-size:12.5px;word-break:break-all;color:var(--soft);margin-bottom:11px;font-family:var(--sans)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
/* ══════════════════════════════════════════════════
   ▼▼▼ 여기 두 줄만 본인 것으로 교체 ▼▼▼
   Supabase > Project Settings > API
   URL 은 .supabase.co 까지만. /rest/v1/ 붙이지 마세요.
   ══════════════════════════════════════════════════ */
const SUPABASE_URL = "https://whyoeekvnvqtsgqmlywj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoeW9lZWt2bnZxdHNncW1seXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjM1NDAsImV4cCI6MjEwMjQzOTU0MH0.mYIrGDbzNo_4Rg_lEKU5cI4YJXyuQtDoQYRC5j1M47U";
/* ══════════════════════════════════════════════════ */

const { useState, useEffect, useRef } = React;

const CONFIG_ERROR = (() => {
  if (/[^\x00-\xFF]/.test(SUPABASE_URL) || /[^\x00-\xFF]/.test(SUPABASE_ANON_KEY))
    return "Supabase 주소나 키에 한글이 남아 있습니다. index.html 위쪽 두 줄을 실제 값으로 바꿔 주세요.";
  if (SUPABASE_URL.includes("PROJECT-REF") || SUPABASE_ANON_KEY.includes("PASTE-ANON-KEY"))
    return "index.html 위쪽 두 줄이 아직 예시값입니다. Supabase의 Project URL과 anon 키로 바꿔 주세요.";
  if (!/^https:\/\/.+\.supabase\.co\/?$/.test(SUPABASE_URL.trim()))
    return "Supabase 주소 형식이 맞지 않습니다. https://xxxxx.supabase.co 형태여야 하며 /rest/v1/ 은 빼야 합니다.";
  return null;
})();

const sb = CONFIG_ERROR ? null
  : window.supabase.createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim());

const SPINES = ["#3f5e5c","#6b4152","#5a5c33","#7a4a35","#3c4468","#4c4a42","#6a5330"];
const pick = (s) => {
  let h = 0;
  for (let i = 0; i < (s||"").length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
  return SPINES[h % SPINES.length];
};

async function callAI(mode, payload) {
  const r = await fetch("/api/gemini", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode, payload })
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "AI 호출에 실패했습니다.");
  return d;
}

/* ═══════════ 로그인 ═══════════ */
function Auth() {
  const [err, setErr] = useState("");
  const go = async () => {
    setErr("");
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.hash }
    });
    if (error) setErr(error.message);
  };
  return (
    <div style={{paddingTop:"20vh"}}>
      <h1 style={{fontFamily:"var(--serif)",fontSize:31,letterSpacing:".12em",margin:"0 0 12px"}}>책은성장</h1>
      <p style={{color:"var(--soft)",fontSize:14,margin:"0 0 32px",lineHeight:1.85}}>
        읽은 책이 흩어지지 않도록.<br/>문장을 담고, 이야기하고, 남겨둡니다.
      </p>
      {err && <div className="err">{err}</div>}
      <button className="btn" style={{width:"100%"}} onClick={go}>구글 계정으로 시작하기</button>
    </div>
  );
}

/* ═══════════ 서재 ═══════════ */
function Shelf({ me, onOpen }) {
  const [books, setBooks] = useState(null);
  const [quotes, setQuotes] = useState([]);
  const [topics, setTopics] = useState([]);
  const [counts, setCounts] = useState({});
  const [adding, setAdding] = useState(false);
  const [manual, setManual] = useState(false);
  const [sq, setSq] = useState("");
  const [found, setFound] = useState(null);
  const [finding, setFinding] = useState(false);
  const [addErr, setAddErr] = useState("");
  const [view, setView] = useState("spine");
  const [q, setQ] = useState("");
  const [f, setF] = useState({ title:"", author:"", publisher:"" });
  const [err, setErr] = useState("");

  const load = async () => {
    const { data: bs, error } = await sb.from("books").select("*")
      .order("created_at",{ascending:false});
    if (error) { setErr(error.message); setBooks([]); return; }
    setBooks(bs || []);
    const { data: qs } = await sb.from("quotes").select("*");
    const list = qs || [];
    setQuotes(list);
    const c = {};
    list.forEach(x => { c[x.book_id] = (c[x.book_id]||0) + 1; });
    setCounts(c);
    const { data: ts } = await sb.from("topics").select("*");
    setTopics(ts || []);
  };
  useEffect(() => { load(); }, []);

  const bookById = {};
  (books||[]).forEach(b => { bookById[b.id] = b; });

  // 오늘의 문장 — 날짜를 씨앗으로 삼아 하루 동안 같은 문장이 뜹니다.
  const daily = (() => {
    if (!quotes.length) return null;
    const d = new Date();
    const seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
    return quotes[seed % quotes.length];
  })();

  // 검색 — 문장 본문·메모·주제 제목·요약·키워드를 함께 훑습니다.
  const term = q.trim().toLowerCase();
  const hit = (s) => s && s.toLowerCase().includes(term);
  const results = !term ? null : {
    quotes: quotes.filter(x => hit(x.content) || hit(x.memo)),
    topics: topics.filter(t => hit(t.title) || hit(t.summary) || hit(t.keyword) || hit(t.unresolved))
  };

  const add = async () => {
    if (!f.title.trim()) return;
    const { error } = await sb.from("books").insert({
      title: f.title.trim(),
      author: f.author.trim() || null,
      publisher: f.publisher.trim() || null
    });
    if (error) { setAddErr(error.message); return; }
    closeAdd(); load();
  };

  const closeAdd = () => {
    setAdding(false); setManual(false); setSq(""); setFound(null); setAddErr("");
    setF({title:"",author:"",publisher:""});
  };

  const findBook = async () => {
    if (!sq.trim()) return;
    setFinding(true); setAddErr(""); setFound(null);
    try {
      const r = await fetch("/api/aladin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: sq.trim() })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "검색에 실패했습니다.");
      setFound(d.items || []);
    } catch (e) { setAddErr(e.message); }
    setFinding(false);
  };

  const addFrom = async (it) => {
    const { error } = await sb.from("books").insert({
      title: it.title, author: it.author || null, publisher: it.publisher || null,
      cover_url: it.cover || null, isbn13: it.isbn13 || null,
      link: it.link || null, pub_date: it.pubDate || null
    });
    if (error) { setAddErr(error.message); return; }
    closeAdd(); load();
  };

  if (books === null) return <div className="empty">불러오는 중</div>;

  return (
    <>
      <div className="top">
        <h1>서재</h1>
        {books.length > 0 &&
          <button className="sub" style={{color:"var(--accent)"}}
            onClick={()=>setView(view==="spine"?"cover":"spine")}>
            {view==="spine" ? "표지로 보기" : "책등으로 보기"}
          </button>}
        <span className="sub" style={{marginLeft:books.length>0?10:"auto"}}>{books.length}권</span>
      </div>
      {err && <div className="err">{err}</div>}

      {books.length > 0 && (
        <input className="search" value={q} onChange={e=>setQ(e.target.value)}
          placeholder="문장·주제 찾기"/>
      )}

      {results ? (
        (results.quotes.length + results.topics.length === 0) ? (
          <div className="empty">찾는 것이 없습니다.</div>
        ) : (
          <>
            {results.quotes.map(x => {
              const b = bookById[x.book_id];
              return (
                <button className="card" style={{width:"100%",textAlign:"left"}} key={x.id}
                  onClick={()=>b && onOpen(b)}>
                  <div className="qmeta">
                    <span className="pg">{b ? b.title : "책"}</span>
                    {x.page && <span>{x.page}쪽</span>}
                  </div>
                  <div className="quote">{x.content}</div>
                  {x.memo && <div className="memo">{x.memo}</div>}
                </button>
              );
            })}
            {results.topics.map(t => {

/* ═══════════ 문장 ═══════════ */
function Quotes({ book, quotes, reload }) {
  const [open, setOpen] = useState(false);
  const [f, setF] = useState({ id:null, page:"", content:"", memo:"" });
  const [err, setErr] = useState("");

  const blank = { id:null, page:"", content:"", memo:"" };

  const startAdd = () => { setF(blank); setOpen(true); };
  const startEdit = (q) => {
    setF({ id:q.id, page:q.page||"", content:q.content||"", memo:q.memo||"" });
    setOpen(true);
  };

  const save = async () => {
    if (!f.content.trim()) return;
    setErr("");
    const body = {
      page: f.page.trim() || null,
      content: f.content.trim(),
      memo: f.memo.trim() || null
    };
    const { error } = f.id
      ? await sb.from("quotes").update(body).eq("id", f.id)
      : await sb.from("quotes").insert({ ...body, book_id: book.id, input_type: "typed" });
    if (error) { setErr(error.message); return; }
    setOpen(false); setF(blank); reload();
  };

  const del = async () => {
    if (!f.id) return;
    if (!window.confirm("이 문장을 지웁니다. 되돌릴 수 없습니다.")) return;
    await sb.from("quotes").delete().eq("id", f.id);
    setOpen(false); setF(blank); reload();
  };

  return (
    <>
      {err && <div className="err">{err}</div>}
      {quotes.length === 0 ? (
        <div className="empty">
          <b>담은 문장이 없습니다</b>
          읽다가 멈춰 세운 문장을 그대로 옮겨 두세요.<br/>대화는 이 문장들에서 시작합니다.
        </div>
      ) : quotes.map(q => (
        <div className="card" key={q.id}>
          <div className="qmeta">
            {q.page && <span className="pg">{q.page}</span>}
            <button style={{marginLeft:"auto",color:"var(--soft)",fontSize:12}}
              onClick={()=>startEdit(q)}>고치기</button>
          </div>
          <div className="quote">{q.content}</div>
          {q.memo && <div className="memo">{q.memo}</div>}
        </div>
      ))}
      <button className="btn fab" onClick={startAdd}>문장 담기</button>

      {open && (
        <div className="sheet" onClick={e=>e.target===e.currentTarget&&setOpen(false)}>
          <div className="box">
            <h2>{f.id ? "문장 고치기" : "문장 담기"}</h2>
            <div className="field"><label>쪽수 (선택)</label>
              <input value={f.page} onChange={e=>setF({...f,page:e.target.value})} placeholder="112"/></div>
            <div className="field"><label>문장</label>
              <textarea rows="5" value={f.content} onChange={e=>setF({...f,content:e.target.value})} autoFocus/></div>
            <div className="field"><label>스친 생각 (선택)</label>
              <textarea rows="2" value={f.memo} onChange={e=>setF({...f,memo:e.target.value})}/></div>
            <div className="row" style={{marginTop:8}}>
              <button className="btn ghost" onClick={()=>setOpen(false)}>취소</button>
              <button className="btn" onClick={save}>{f.id ? "고치기" : "담기"}</button>
            </div>
            {f.id && (
              <button style={{width:"100%",marginTop:14,color:"var(--rose)",fontSize:13.5}}
                onClick={del}>이 문장 지우기</button>
            )}
          </div>
        </div>
      )}
    </>
  );
}

/* ═══════════ 대화 ═══════════ */
function Talk({ book, quotes, me, onOrganized }) {
  const [session, setSession] = useState(null);
  const [msgs, setMsgs] = useState([]);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [org, setOrg] = useState(false);
  const [err, setErr] = useState("");
  const endRef = useRef(null);

  useEffect(() => { (async () => {
    const { data } = await sb.from("sessions").select("*")
      .eq("book_id", book.id).eq("status","open")
      .order("created_at",{ascending:false}).limit(1);
    let s = data && data[0];
    if (!s) {
      const { data: made, error } = await sb.from("sessions")
        .insert({ book_id: book.id, title: "대화" }).select().single();
      if (error) { setErr(error.message); return; }
      s = made;
    }
    setSession(s);
    const { data: ms } = await sb.from("messages").select("*")
      .eq("session_id", s.id).order("created_at",{ascending:true});
    setMsgs(ms || []);
  })(); }, [book.id]);

  useEffect(() => { endRef.current && endRef.current.scrollIntoView({behavior:"smooth"}); }, [msgs, busy]);

  const send = async () => {
    const t = text.trim();
    if (!t || !session || busy) return;
    setText(""); setErr(""); setBusy(true);
    const mine = { session_id: session.id, role:"human", author_name: me.name, content: t };
    const { data: saved } = await sb.from("messages").insert(mine).select().single();
    const next = [...msgs, saved || {...mine, id:"tmp"}];
    setMsgs(next);
    try {
      const { text: reply } = await callAI("chat", {
        book: { title: book.title, author: book.author },
        quotes: quotes.map(q => ({ page:q.page, content:q.content, memo:q.memo })),
        history: next.map(m => ({ role:m.role, content:m.content }))
      });
      const { data: aiSaved } = await sb.from("messages")
        .insert({ session_id: session.id, role:"ai", author_name:"AI", content: reply })
        .select().single();
      setMsgs(m => [...m, aiSaved]);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  const organize = async () => {
    if (!window.confirm("지금까지의 대화를 주제별로 정리해 남깁니다. 대화는 이어서 계속할 수 있습니다.")) return;
    setOrg(true); setErr("");
    try {
      const qmap = {};
      quotes.forEach((q,i) => { qmap["q"+(i+1)] = q.id; });
      const { topics } = await callAI("organize", {
        book: { title: book.title, author: book.author },
        quotes: quotes.map((q,i) => ({ id:"q"+(i+1), page:q.page, content:q.content })),
        messages: msgs.map(m => ({ who: m.author_name, content: m.content }))
      });
      const { data: base } = await sb.from("topics").select("order_no")
        .eq("book_id", book.id).order("order_no",{ascending:false}).limit(1);
      let start = base && base[0] ? base[0].order_no + 1 : 0;
      for (let i = 0; i < topics.length; i++) {
        const t = topics[i];
        const { data: tp, error } = await sb.from("topics").insert({
          book_id: book.id, session_id: session.id,
          title: t.title, summary: t.summary || null,
          keyword: t.keyword || null, unresolved: t.unresolved || null,
          apply_note: t.apply_note || null, order_no: start + i
        }).select().single();
        if (error) throw new Error(error.message);
        const links = (t.quote_ids||[]).map(k => qmap[k]).filter(Boolean)
          .map(qid => ({ topic_id: tp.id, quote_id: qid }));
        if (links.length) await sb.from("topic_quotes").insert(links);
        const ops = (t.opinions||[]).filter(o => o.content)
          .map(o => ({ topic_id: tp.id, author_name: o.author_name || me.name, content: o.content }));
        if (ops.length) await sb.from("topic_opinions").insert(ops);
      }
      onOrganized();
    } catch (e) { setErr(e.message); }
    setOrg(false);
  };

  return (
    <>
      {err && <div className="err">{err}</div>}
      {msgs.length === 0 && !busy && (
        <div className="empty">
          <b>무엇이든 먼저 던져 보세요</b>
          담아둔 문장 {quotes.length}개를 이미 읽고 있습니다.<br/>
          질문을 되돌려주고, 다른 관점도 내놓습니다.
        </div>
      )}
      {msgs.map(m => (
        <div className={"msg " + (m.role==="ai" ? "ai" : "human")} key={m.id}>
          <span className="who">{m.author_name}</span>
          <div className="bubble">{m.content}</div>
        </div>
      ))}
      {busy && <div className="thinking">생각하는 중…</div>}
      {msgs.length >= 4 && !busy && (
        <button className="btn ghost sm" style={{width:"100%",marginTop:6}} onClick={organize} disabled={org}>
          {org ? "정리하는 중…" : "여기까지 주제별로 정리하기"}
        </button>
      )}
      <div ref={endRef}/>
      <div className="composer">
        <div className="in">
          <textarea rows="1" value={text} placeholder="이 책에 대해…"
            onChange={e=>setText(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}/>
          <button className="btn sm" onClick={send} disabled={busy}>보내기</button>
        </div>
      </div>
    </>
  );
}

/* ═══════════ 주제 목록 (서재·사랑방 공용) ═══════════ */
function TopicList({ bookId, me, canWrite }) {
  const [data, setData] = useState(null);
  const [draft, setDraft] = useState({});
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");

  const load = async () => {
    const { data: ts, error } = await sb.from("topics").select("*")
      .eq("book_id", bookId).order("order_no",{ascending:true});
    if (error) { setErr(error.message); setData([]); return; }
    if (!ts || !ts.length) { setData([]); return; }
    const ids = ts.map(t => t.id);
    const { data: qs } = await sb.from("quotes").select("*").eq("book_id", bookId);
    const qById = {}; (qs||[]).forEach(q => { qById[q.id] = q; });
    const { data: tq } = await sb.from("topic_quotes").select("*").in("topic_id", ids);
    const { data: op } = await sb.from("topic_opinions").select("*").in("topic_id", ids)
      .order("created_at",{ascending:true});
    setData(ts.map(t => ({
      ...t,
      quotes: (tq||[]).filter(x=>x.topic_id===t.id).map(x=>qById[x.quote_id]).filter(Boolean),
      opinions: (op||[]).filter(x=>x.topic_id===t.id)
    })));
  };
  useEffect(() => { load(); }, [bookId]);

  const addOpinion = async (topicId) => {
    const c = (draft[topicId]||"").trim();
    if (!c) return;
    setBusy(topicId); setErr("");
    const { error } = await sb.from("topic_opinions")
      .insert({ topic_id: topicId, author_name: me.name, content: c });
    setBusy("");
    if (error) { setErr(error.message); return; }
    setDraft({...draft, [topicId]:""});
    load();
  };

  const delOpinion = async (id) => {
    if (!window.confirm("내 의견을 지웁니다.")) return;
    await sb.from("topic_opinions").delete().eq("id", id);
    load();
  };

  if (data === null) return <div className="empty">불러오는 중</div>;
  if (!data.length) return (
    <div className="empty">
      <b>아직 정리된 주제가 없습니다</b>
      대화를 나눈 뒤 ‘주제별로 정리하기’를 누르면<br/>여기 쌓입니다.
    </div>
  );

  return (
    <>
      {err && <div className="err">{err}</div>}
      {data.map((t, i) => (
        <div className="topic" key={t.id}>
          <span className="num">{t.keyword ? t.keyword : "주제 " + String(i+1).padStart(2,"0")}</span>
          <h3>{t.title}</h3>
          {t.summary && <div style={{fontSize:14.5,lineHeight:1.75,color:"#57513f"}}>{t.summary}</div>}
          {t.quotes.map(q => (
            <div className="tq" key={q.id}>{q.content}
              {q.page && <span className="pg">{q.page}쪽</span>}
            </div>
          ))}
          {t.opinions.map(o => (
            <div className={"op" + (o.user_id === me.id ? " mine" : "")} key={o.id}>
              <b>{o.author_name}</b>{o.content}
              {o.user_id === me.id &&
                <button style={{color:"var(--soft)",fontSize:11,marginLeft:8}}
                  onClick={()=>delOpinion(o.id)}>지우기</button>}
            </div>
          ))}
          {t.unresolved && <div className="loose"><b>매듭짓지 못한 것</b>{t.unresolved}</div>}
          {t.apply_note && <div className="apply"><b>내게 적용할 점</b>{t.apply_note}</div>}
          {canWrite && (
            <div className="opbox">
              <textarea rows="2" placeholder="여기에 의견을 더하기"
                value={draft[t.id]||""}
                onChange={e=>setDraft({...draft,[t.id]:e.target.value})}/>
              <button className="btn ghost sm" style={{width:"100%",marginTop:8}}
                onClick={()=>addOpinion(t.id)} disabled={busy===t.id}>
                {busy===t.id ? "남기는 중…" : "의견 남기기"}
              </button>
            </div>
          )}
        </div>
      ))}
    </>
  );
}

/* ═══════════ 내 책 (서재) ═══════════ */
function BookView({ book, me, onBack, onChanged }) {
  const [tab, setTab] = useState("quotes");
  const [quotes, setQuotes] = useState([]);
  const [key, setKey] = useState(0);
  const [share, setShare] = useState(false);
  const [note, setNote] = useState(book.share_note || "");
  const [copied, setCopied] = useState(false);
  const [err, setErr] = useState("");
  const [shared, setShared] = useState(!!book.shared_at);

  const link = window.location.origin + "/#/b/" + book.id;

  const load = async () => {
    const { data } = await sb.from("quotes").select("*")
      .eq("book_id", book.id).order("created_at",{ascending:true});
    setQuotes(data || []);
  };
  useEffect(() => { load(); }, [book.id]);

  const publish = async () => {
    const { error } = await sb.from("books")
      .update({ shared_at: new Date().toISOString(), share_note: note.trim() || null })
      .eq("id", book.id);
    if (error) { setErr(error.message); return; }
    setShared(true); onChanged && onChanged();
  };
  const unpublish = async () => {
    if (!window.confirm("사랑방에서 내립니다. 팀원이 남긴 의견은 지워지지 않습니다.")) return;
    const { error } = await sb.from("books").update({ shared_at: null }).eq("id", book.id);
    if (error) { setErr(error.message); return; }
    setShared(false); setShare(false); onChanged && onChanged();
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(link); setCopied(true); setTimeout(()=>setCopied(false),2200); }
    catch { setErr("복사에 실패했습니다. 아래 주소를 길게 눌러 복사해 주세요."); }
  };

  return (
    <>
      <button className="back" onClick={onBack}>← 서재</button>
      <div className="top" style={{paddingTop:6,alignItems:"baseline"}}>
        <h1 style={{fontSize:20,letterSpacing:".02em"}}>{book.title}</h1>
        <button className="sub" style={{color:"var(--accent)"}} onClick={()=>setShare(true)}>
          {shared ? "공유 중" : "사랑방에 올리기"}
        </button>
      </div>
      {book.author && <div style={{color:"var(--soft)",fontSize:13,marginTop:-8}}>{book.author}</div>}
      {book.cover_url && (
        <div style={{display:"flex",gap:14,alignItems:"flex-start",marginTop:14}}>
          <img src={book.cover_url} alt="" style={{width:78,borderRadius:4,
            boxShadow:"0 3px 10px rgba(80,60,30,.28)"}}/>
          <div style={{fontSize:12.5,color:"var(--soft)",lineHeight:1.8,paddingTop:2}}>
            {book.publisher}{book.pub_date ? " · " + book.pub_date.slice(0,4) : ""}
            {book.link &&
              <a href={book.link} target="_blank" rel="noreferrer"
                style={{display:"block",color:"var(--accent)",marginTop:5}}>알라딘에서 보기</a>}
          </div>
        </div>
      )}
      {err && <div className="err" style={{marginTop:12}}>{err}</div>}

      <div className="tabs">
        <button className={tab==="quotes"?"on":""} onClick={()=>setTab("quotes")}>문장 {quotes.length}</button>
        <button className={tab==="talk"?"on":""} onClick={()=>setTab("talk")}>대화</button>
        <button className={tab==="topics"?"on":""} onClick={()=>setTab("topics")}>정리</button>
      </div>

      {tab==="quotes" && <Quotes book={book} quotes={quotes} reload={load}/>}
      {tab==="talk"   && <Talk book={book} quotes={quotes} me={me}
                          onOrganized={()=>{setKey(k=>k+1);setTab("topics");}}/>}
      {tab==="topics" && <TopicList key={key} bookId={book.id} me={me} canWrite={true}/>}

      {share && (
        <div className="sheet" onClick={e=>e.target===e.currentTarget&&setShare(false)}>
          <div className="box">
            <h2>사랑방에 올리기</h2>
            {shared ? (
              <>
                <p style={{fontSize:13.5,color:"var(--soft)",lineHeight:1.8,marginTop:0}}>
                  이 링크를 아는 사람은 정리된 주제를 읽고 의견을 남길 수 있습니다.<br/>
                  담아둔 문장과 정리 내용만 공개되며, AI와 나눈 대화는 공개되지 않습니다.
                </p>
                <div className="linkbox">{link}</div>
                {copied && <div className="ok">링크를 복사했습니다.</div>}
                <button className="btn" style={{width:"100%"}} onClick={copy}>링크 복사</button>
                <button className="btn ghost" style={{width:"100%",marginTop:9}} onClick={unpublish}>
                  사랑방에서 내리기
                </button>
              </>
            ) : (
              <>
                <div className="field">
                  <label>한마디 (선택)</label>
                  <textarea rows="3" value={note} onChange={e=>setNote(e.target.value)}
                    placeholder="어떤 이야기를 나누고 싶은지 적어 두세요."/>
                </div>
                <p style={{fontSize:13,color:"var(--soft)",lineHeight:1.8}}>
                  정리된 주제와 그에 딸린 문장만 공개됩니다.<br/>AI와 나눈 대화는 공개되지 않습니다.
                </p>
                <div className="row" style={{marginTop:8}}>
                  <button className="btn ghost" onClick={()=>setShare(false)}>취소</button>
                  <button className="btn" onClick={publish}>올리기</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </>
  );
}

/* ═══════════ 사랑방 ═══════════ */
function Sarangbang({ me, onOpen, onPeek, onProfile }) {
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => { (async () => {
    const { data, error } = await sb.rpc("sarangbang");
    if (error) { setErr(error.message); setRows([]); return; }
    setRows(data || []);
  })(); }, []);

  if (rows === null) return <div className="empty">불러오는 중</div>;

  return (
    <>
      <div className="top">
        <h1>사랑방</h1>
        <button className="sub" style={{color:"var(--accent)"}} onClick={onProfile}>내 설정</button>
      </div>
      {err && <div className="err">{err}</div>}

      {rows.length === 0 ? (
        <div className="empty">
          <b>아직 올라온 책이 없습니다</b>
          서재에서 정리를 마친 책을 올리거나,<br/>받은 링크를 열면 여기에 모입니다.
        </div>
      ) : rows.map(r => (
        <div key={r.id}>
          <button className="sbook" onClick={()=>onOpen(r.id)}>
            {r.cover_url
              ? <img className="sthumb" src={r.cover_url} alt="" loading="lazy"/>
              : <span className="bar" style={{background:pick(r.title)}}/>}
            <span style={{flex:1}}>
              <h4>{r.title}</h4>
              <div className="meta">
                {r.is_mine ? "내가 올림" : r.owner_name}
                {" · 주제 " + r.topic_count + " · 의견 " + r.opinion_count}
              </div>
              {r.share_note && <div className="note">{r.share_note}</div>}
            </span>
          </button>
          {!r.is_mine && r.shelf_public && (
            <button style={{color:"var(--accent)",fontSize:12.5,margin:"-4px 0 12px 20px"}}
              onClick={()=>onPeek(r.owner_id, r.owner_name)}>
              {r.owner_name}님의 서재 둘러보기 →
            </button>
          )}
        </div>
      ))}
    </>
  );
}

/* ═══════════ 공유된 책 열기 ═══════════ */
function SharedBook({ bookId, me, onBack }) {
  const [info, setInfo] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => { (async () => {
    const { data, error } = await sb.rpc("open_shared_book", { b_id: bookId });
    if (error) { setErr(error.message); return; }
    setInfo(data && data[0]);
  })(); }, [bookId]);

  if (err) return (
    <>
      <button className="back" onClick={onBack}>← 사랑방</button>
      <div className="err" style={{marginTop:16}}>{err}</div>
    </>
  );
  if (!info) return <div className="empty">불러오는 중</div>;

  return (
    <>
      <button className="back" onClick={onBack}>← 사랑방</button>
      <div className="top" style={{paddingTop:6,alignItems:"baseline"}}>
        <h1 style={{fontSize:20,letterSpacing:".02em"}}>{info.title}</h1>
      </div>
      <div style={{color:"var(--soft)",fontSize:13,marginTop:-8,marginBottom:6}}>
        {info.author ? info.author + " · " : ""}{info.is_mine ? "내가 올림" : info.owner_name + "님이 올림"}
      </div>
      {info.cover_url && (
        <div style={{display:"flex",gap:14,alignItems:"flex-start",margin:"12px 0 4px"}}>
          <img src={info.cover_url} alt="" style={{width:70,borderRadius:4,
            boxShadow:"0 3px 10px rgba(80,60,30,.28)"}}/>
          {info.link &&
            <a href={info.link} target="_blank" rel="noreferrer"
              style={{color:"var(--accent)",fontSize:12.5,paddingTop:2}}>알라딘에서 보기</a>}
        </div>
      )}
      {info.share_note && <div className="card" style={{fontSize:14,lineHeight:1.8}}>{info.share_note}</div>}
      <div style={{height:8}}/>
      <TopicList bookId={bookId} me={me} canWrite={true}/>
    </>
  );
}

/* ═══════════ 남의 서재 둘러보기 ═══════════ */
function PeekShelf({ ownerId, ownerName, onOpen, onBack }) {
  const [rows, setRows] = useState(null);
  useEffect(() => { (async () => {
    const { data } = await sb.rpc("public_shelf", { owner: ownerId });
    setRows(data || []);
  })(); }, [ownerId]);

  if (rows === null) return <div className="empty">불러오는 중</div>;
  return (
    <>
      <button className="back" onClick={onBack}>← 사랑방</button>
      <div className="top" style={{paddingTop:6}}>
        <h1 style={{fontSize:20}}>{ownerName}님의 서재</h1>
        <span className="sub">{rows.length}권</span>
      </div>
      {rows.length === 0 ? (
        <div className="empty">공개된 책이 없습니다.</div>
      ) : (
        <div className="shelf-row">
          {rows.map(b => (
            <button key={b.id} className="spine"
              style={{background:pick(b.title), width:Math.min(34 + b.topic_count*4, 62)}}
              onClick={()=>onOpen(b.id)} title={b.title}>
              <span>{b.title}</span>
            </button>
          ))}
        </div>
      )}
    </>
  );
}

/* ═══════════ 내 설정 ═══════════ */
function Profile({ me, onBack, onSaved }) {
  const [name, setName] = useState(me.name);
  const [open, setOpen] = useState(me.shelfPublic);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");

  const save = async () => {
    const n = name.trim();
    if (!n) { setErr("이름을 적어 주세요."); return; }
    const { error } = await sb.from("profiles")
      .update({ display_name: n, shelf_public: open })
      .eq("id", me.id);
    if (error) { setErr(error.message); return; }
    await sb.from("topic_opinions").update({ author_name: n }).eq("user_id", me.id);
    await sb.from("messages").update({ author_name: n }).eq("user_id", me.id).eq("role", "human");
    setMsg("저장했습니다."); setTimeout(()=>setMsg(""), 2200);
    onSaved && onSaved();
  };

  return (
    <>
      <button className="back" onClick={onBack}>← 사랑방</button>
      <div className="top" style={{paddingTop:6}}><h1 style={{fontSize:20}}>내 설정</h1></div>
      {err && <div className="err">{err}</div>}
      {msg && <div className="ok">{msg}</div>}

      <div className="field">
        <label>사랑방에서 보일 이름</label>
        <input value={name} onChange={e=>setName(e.target.value)}/>
      </div>

      <label className="toggle">
        <input type="checkbox" checked={open} onChange={e=>setOpen(e.target.checked)}/>
        <span>
          <b style={{display:"block",marginBottom:3}}>서재 둘러보기 허용</b>
          <span style={{color:"var(--soft)"}}>
            켜면 사랑방에서 만난 사람이 내 서재를 볼 수 있습니다.
            사랑방에 올린 책만 보이며, 정리 전 책과 AI 대화는 보이지 않습니다.
          </span>
        </span>
      </label>

      <button className="btn" style={{width:"100%"}} onClick={save}>저장</button>
      <button className="btn ghost" style={{width:"100%",marginTop:9}}
        onClick={()=>sb.auth.signOut()}>로그아웃</button>
    </>
  );
}

/* ═══════════ 닉네임 정하기 (첫 로그인) ═══════════ */
function Nickname({ uid, onDone }) {
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const save = async () => {
    const n = name.trim();
    if (n.length < 1) { setErr("이름을 한 글자 이상 적어 주세요."); return; }
    if (n.length > 20) { setErr("20자 이내로 적어 주세요."); return; }
    setBusy(true); setErr("");
    const { error } = await sb.from("profiles").update({ display_name: n }).eq("id", uid);
    if (error) { setErr(error.message); setBusy(false); return; }
    await sb.from("topic_opinions").update({ author_name: n }).eq("user_id", uid);
    await sb.from("messages").update({ author_name: n }).eq("user_id", uid).eq("role", "human");
    setBusy(false);
    onDone();
  };

  return (
    <div style={{paddingTop:"16vh"}}>
      <h1 style={{fontFamily:"var(--serif)",fontSize:26,letterSpacing:".08em",margin:"0 0 12px"}}>
        어떻게 불러 드릴까요
      </h1>
      <p style={{color:"var(--soft)",fontSize:14,margin:"0 0 26px",lineHeight:1.85}}>
        사랑방에서 보일 이름입니다. 본명이 아니어도 됩니다.<br/>
        나중에 설정에서 언제든 바꿀 수 있습니다.
      </p>
      {err && <div className="err">{err}</div>}
      <div className="field">
        <input value={name} placeholder="예: 늦은밤독서" autoFocus
          onChange={e=>setName(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&save()}/>
      </div>
      <button className="btn" style={{width:"100%"}} onClick={save} disabled={busy}>
        {busy ? "저장하는 중" : "시작하기"}
      </button>
    </div>
  );
}

/* ═══════════ 앱 ═══════════ */
function App() {
  const [session, setSession] = useState(undefined);
  const [me, setMe] = useState(null);
  const [tab, setTab] = useState("shelf");
  const [route, setRoute] = useState(null);

  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({data}) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  const loadMe = async (uid) => {
    const { data } = await sb.from("profiles").select("*").eq("id", uid).single();
    const { data: mem } = await sb.rpc("is_member");
    setMe({
      id: uid,
      name: (data && data.display_name) || null,
      shelfPublic: !!(data && data.shelf_public),
      member: !!mem
    });
  };

  useEffect(() => {
    if (!session) { setMe(null); return; }
    loadMe(session.user.id);
    const m = window.location.hash.match(/#\/b\/([0-9a-f-]{36})/i);
    if (m) {
      setTab("sarangbang");
      setRoute({ v:"shared", id:m[1] });
      window.history.replaceState(null, "", window.location.pathname);
    }
  }, [session]);

  if (CONFIG_ERROR) return (
    <div style={{paddingTop:"20vh"}}>
      <h1 style={{fontFamily:"var(--serif)",fontSize:30,letterSpacing:".1em",margin:"0 0 18px"}}>책은성장</h1>
      <div className="err">{CONFIG_ERROR}</div>
    </div>
  );
  if (session === undefined) return null;
  if (!session) return <Auth/>;
  if (!me) return null;
  if (!me.name) return <Nickname uid={me.id} onDone={()=>loadMe(me.id)}/>;

  let body;
  if (route && route.v === "book")
    body = <BookView book={route.book} me={me} onBack={()=>setRoute(null)} onChanged={()=>{}}/>;
  else if (route && route.v === "shared")
    body = <SharedBook bookId={route.id} me={me} onBack={()=>setRoute(null)}/>;
  else if (route && route.v === "peek")
    body = <PeekShelf ownerId={route.id} ownerName={route.name}
             onOpen={(id)=>setRoute({v:"shared",id})} onBack={()=>setRoute(null)}/>;
  else if (route && route.v === "profile")
    body = <Profile me={me} onBack={()=>setRoute(null)} onSaved={()=>loadMe(me.id)}/>;
  else if (tab === "shelf")
    body = <Shelf me={me} onOpen={(b)=>setRoute({v:"book",book:b})}/>;
  else
    body = <Sarangbang me={me}
             onOpen={(id)=>setRoute({v:"shared",id})}
             onPeek={(id,name)=>setRoute({v:"peek",id,name})}
             onProfile={()=>setRoute({v:"profile"})}/>;

  return (
    <>
      {body}
      <div className="nav">
        <button className={tab==="shelf"&&!route?"on":""}
          onClick={()=>{setRoute(null);setTab("shelf");}}>서재</button>
        <button className={tab==="sarangbang"&&!route?"on":""}
          onClick={()=>{setRoute(null);setTab("sarangbang");}}>사랑방</button>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
